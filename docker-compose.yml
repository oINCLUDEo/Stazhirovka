networks:
  selenoid:
    name: selenoid
    external: true

services:
  selenoid:
    image: aerokube/selenoid:latest-release
    restart: always
    ports:
      - "4444:4444"
    volumes:
      - ./selenoid:/etc/selenoid
      - /var/run/docker.sock:/var/run/docker.sock
      - ./selenoid-videos:/opt/selenoid/video
      - ./selenoid-logs:/opt/selenoid/logs
    environment:
      - OVERRIDE_VIDEO_OUTPUT_DIR=./selenoid-videos
    command: [
      "-conf", "/etc/selenoid/browsers.json",
      "-video-output-dir", "/opt/selenoid/video",
      "-log-output-dir", "/opt/selenoid/logs",
      "-container-network", "selenoid",
      "-service-startup-timeout", "200s",
      "-session-attempt-timeout", "200s",
      "-session-delete-timeout", "200s"
    ]
    networks:
      selenoid: null

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - selenoid
    environment:
      - SELENOID_URL=http://selenoid:4444/wd/hub
      - browser=chrome
    volumes:
      - ./downloads:/app/downloads
      - ./allure-results:/app/target/allure-results
      - ./maven-cache:/root/.m2
    command: ["mvn", "test", "-Dmaven.clean.skip=true"]
    networks:
      - selenoid

